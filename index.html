let DB = seedDB();
let CURRENT_USER = null;
try{ CURRENT_USER = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); }catch(e){ CURRENT_USER = null; }

function saveDB(db){
  db.settings.lastSync = new Date().toISOString();
  setDoc(PURE_LINE_DOC, db).catch(err => {
    console.error("خطأ المزامنة بالسحابة:", err);
    toast('تعذر حفظ البيانات أونلاين', 'err');
  });
}

// المزامنة اللحظية مع الفايربيس
onSnapshot(PURE_LINE_DOC, (snapshot) => {
  if (snapshot.exists()) {
    DB = snapshot.data();
  } else {
    DB = seedDB();
    saveDB(DB);
  }
  const statusEl = document.getElementById('cloudStatusText');
  if(statusEl) statusEl.textContent = 'متصل بالسحابة — البيانات محفوظة';
  if (CURRENT_USER) {
    navigate(CURRENT_VIEW);
  }
}, (error) => {
  const statusEl = document.getElementById('cloudStatusText');
  if(statusEl) statusEl.textContent = 'خطأ في الاتصال بالسحابة';
});

/* ---------------------------- utilities ---------------------------- */
function uid(prefix){ const id = (DB.seq++).toString().padStart(5,'0'); saveDB(DB); return `${prefix}-${id}`; }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleString('ar-EG', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function esc(s){ return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function computeStock(){
  const received = DB.batches.reduce((s,b)=>s+Number(b.quantity||0),0);
  const distributed = DB.distributions.reduce((s,d)=>s+Number(d.quantity||0),0);
  const lost = DB.losses.reduce((s,l)=>s+Number(l.quantity||0),0);
  return { received, distributed, lost, available: received - distributed - lost };
}

const GRADE_FIELDS = [
  { k:'salim',   l:'سليم' },
  { k:'laih',    l:'لايح' },
  { k:'farza',   l:'فرزة' },
  { k:'fates',   l:'فاطس' },
  { k:'maadoom', l:'معدوم' },
  { k:'mrsous',  l:'مرصوص' }
];

function batchGradeBreakdown(b){
  const total = Number(b.quantity) || GRADE_FIELDS.reduce((s,g)=>s+Number(b[g.k]||0),0);
  return GRADE_FIELDS.map(g=>{
    const val = Number(b[g.k]||0);
    return { label:g.l, val, pct: total>0 ? (val/total*100) : 0 };
  });
}

// fmt helper for the records table / CSV export: shows count + its % of the batch total
function gradeCell(val, row){
  const total = row ? (Number(row.quantity) || GRADE_FIELDS.reduce((s,g)=>s+Number(row[g.k]||0),0)) : 0;
  const v = Number(val||0);
  const pct = total>0 ? (v/total*100).toFixed(1) : '0.0';
  return `${v.toLocaleString('ar-EG')} (${pct}%)`;
}

function logAudit(action, entity, details){
  DB.auditLog.unshift({
    id: uid('LOG'),
    action, entity, details,
    user: CURRENT_USER ? `${CURRENT_USER.username} (${roleLabel(CURRENT_USER.role)})` : 'نظام',
    timestamp: nowISO()
  });
  saveDB(DB);
}

function roleLabel(role){ return role === 'owner' ? 'الأونر' : 'الاستلام والتوزيع'; }

function toast(msg, type='ok'){
  const root = document.getElementById('toastRoot');
  if(!root) return;
  const el = document.createElement('div');
  el.className = `btn shadow-lg rounded-xl px-4 py-3 text-sm font-bold text-white ${type==='ok'?'bg-forest':'bg-barn'}`;
  el.style.animation = 'fadeUp .25s ease';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2400);
}

/* ---------------------- image capture / compression ---------------------- */
function compressImageFile(file, maxDim = 900, quality = 0.72){
  return new Promise((resolve, reject)=>{
    if(!file) return resolve(null);
    if(!file.type.startsWith('image/')) return reject(new Error('الملف المختار ليس صورة'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('تعذّرت قراءة الصورة'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('تعذّر تحميل الصورة'));
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * (maxDim / width)); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * (maxDim / height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ------------------------------- nav -------------------------------- */
const NAV = [
  { key:'dashboard',   label:'لوحة التحكم',        icon:ICONS.dashboard, roles:['admin','owner'] },
  { key:'receive',     label:'استلام المعمل',       icon:ICONS.receive,   roles:['admin','owner'] },
  { key:'distribute',  label:'توزيع المبيعات',      icon:ICONS.distribute,roles:['admin','owner'] },
  { key:'loss',        label:'تسجيل النافق',        icon:ICONS.loss,      roles:['admin','owner'] },
  { key:'records',     label:'السجلات والتقارير',   icon:ICONS.records,   roles:['admin','owner'] },
  { key:'owner',       label:'لوحة تحكم الأونر',    icon:ICONS.owner,     roles:['owner'] },
];
let CURRENT_VIEW = 'dashboard';

/* ------------------------------ login -------------------------------- */
document.getElementById('loginForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const match = DB.users.find(x=>x.username===u && x.password===p);
  const errEl = document.getElementById('loginError');
  if(match){
    CURRENT_USER = { username: match.username, role: match.role };
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(CURRENT_USER));
    logAudit('تسجيل دخول', 'مستخدم', `${match.username} دخل كـ ${roleLabel(match.role)}`);
    errEl.classList.add('hidden');
    boot();
  }else{
    errEl.classList.remove('hidden');
  }
});

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  logAudit('تسجيل خروج', 'مستخدم', `${CURRENT_USER.username} خرج من النظام`);
  CURRENT_USER = null;
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
});

/* ------------------------------- boot -------------------------------- */
function boot(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('roleLabel').textContent = roleLabel(CURRENT_USER.role);
  document.getElementById('headerUser').textContent = `${CURRENT_USER.username} — ${roleLabel(CURRENT_USER.role)}`;
  renderNav();
  navigate('dashboard');
}

function renderNav(){
  const list = document.getElementById('navList');
  list.innerHTML = NAV.filter(n=>n.roles.includes(CURRENT_USER.role)).map(n=>`
    <button data-nav="${n.key}" class="navbtn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-cream/85 hover:bg-white/10 transition">
      ${n.icon}<span>${n.label}</span>
    </button>`).join('');
  list.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ navigate(btn.dataset.nav); closeSidebar(); });
  });
}

/* ------------------------- mobile sidebar drawer ------------------------- */
function openSidebar(){
  document.getElementById('sidebar').classList.remove('translate-x-full');
  document.getElementById('sidebarOverlay').classList.remove('hidden');
}
function closeSidebar(){
  if(window.innerWidth >= 768) return;
  document.getElementById('sidebar').classList.add('translate-x-full');
  document.getElementById('sidebarOverlay').classList.add('hidden');
}
document.getElementById('openSidebarBtn').addEventListener('click', openSidebar);
document.getElementById('closeSidebarBtn').addEventListener('click', closeSidebar);
document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

function navigate(key){
  CURRENT_VIEW = key;
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.nav===key));
  const nav = NAV.find(n=>n.key===key);
  document.getElementById('viewTitle').textContent = nav ? nav.label : '';
  const root = document.getElementById('viewRoot');
  root.innerHTML = `<div class="view">${VIEWS[key]()}</div>`;
  attachViewHandlers(key);
}

function statCard(label, value, color, icon){
  return `
  <div class="card p-5 flex items-center justify-between">
    <div>
      <div class="text-sm text-ink/50 font-bold mb-1">${label}</div>
      <div class="text-3xl font-black" style="color:${color}">${value.toLocaleString('ar-EG')}</div>
    </div>
    <div class="w-12 h-12 rounded-2xl flex items-center justify-center" style="background:${color}1A;color:${color}">${icon}</div>
  </div>`;
}

function renderDashboard(){
  const s = computeStock();
  const low = s.available <= DB.settings.thresholdAlert;
  const recent = [
    ...DB.batches.map(b=>({type:'استلام', label:`دفعة ${b.batchNumber}`, qty:b.quantity, date:b.createdAt, color:'#16342A'})),
    ...DB.distributions.map(d=>({type:'توزيع', label:d.buyerName, qty:-d.quantity, date:d.createdAt, color:'#8C3B2E'})),
    ...DB.losses.map(l=>({type:'نافق', label:l.notes||'فاقد', qty:-l.quantity, date:l.createdAt, color:'#9A7526'})),
  ].sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,8);

  return `
  ${low ? `
  <div class="mb-5 bg-barn/10 border border-barn/30 text-barn font-bold rounded-xl px-4 py-3 flex items-center gap-2">
    ${ICONS.loss} تنبيه: المخزون المتاح (${s.available.toLocaleString('ar-EG')}) وصل إلى حد التنبيه (${DB.settings.thresholdAlert.toLocaleString('ar-EG')}) أو أقل.
  </div>`: ''}
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
    ${statCard('إجمالي المستلم', s.received, '#16342A', ICONS.receive)}
    ${statCard('إجمالي الموزع', s.distributed, '#8C3B2E', ICONS.distribute)}
    ${statCard('المخزون المتاح', s.available, '#C89B3C', ICONS.wheat)}
    ${statCard('إجمالي الفاقد', s.lost, '#6B7280', ICONS.loss)}

    <h3 class="font-bold text-forest mb-4">آخر الحركات</h3>
    ${recent.length===0 ? `<p class="text-ink/40 text-sm">لا توجد حركات بعد.</p>` : `
    <div class="space-y-2">
      ${recent.map(r=>`

function updateReceiveTotals(){
  const form = document.getElementById('receiveForm');
  if(!form) return;
  const values = GRADE_FIELDS.map(g=>Number(form[g.k]?.value)||0);
  const total = values.reduce((s,v)=>s+v,0);
  const totalEl = document.getElementById('receiveTotalQty');
  if(totalEl) totalEl.textContent = total.toLocaleString('ar-EG');
  const box = document.getElementById('receivePercentBreakdown');
  if(box){
    box.innerHTML = GRADE_FIELDS.map((g,i)=>{
      const val = values[i];
      const pct = total>0 ? (val/total*100).toFixed(1) : '0.0';
      return `<div class="flex justify-between"><span>${g.l}</span><span>${val.toLocaleString('ar-EG')} — ${pct}%</span></div>`;
    }).join('');
  }
}

function exportBatchesExcel(){
  if(typeof XLSX === 'undefined'){
    toast('تعذّر تحميل مكتبة إكسيل — تأكد من الاتصال بالإنترنت وحاول مجددًا', 'err');
    return;
  }
  const rows = [...DB.batches].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const header = ['رقم الدفعة','المصدر', ...GRADE_FIELDS.flatMap(g=>[g.l, `نسبة ${g.l} %`]), 'الإجمالي','التاريخ','ملاحظات'];
  const data = rows.map(b=>{
    const total = Number(b.quantity) || GRADE_FIELDS.reduce((s,g)=>s+Number(b[g.k]||0),0);
    const cells = [b.batchNumber, b.source];
    GRADE_FIELDS.forEach(g=>{
      const val = Number(b[g.k]||0);
      const pct = total>0 ? Number((val/total*100).toFixed(1)) : 0;
      cells.push(val, pct);
    });
    cells.push(total, fmtDate(b.createdAt), b.notes||'');
    return cells;
  });
  const ws = XLSX.utils.aoa_to_sheet([header, ...data]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'دفعات المعمل');
  XLSX.writeFile(wb, `pureline_batches_${Date.now()}.xlsx`);
  logAudit('تصدير بيانات', 'batches', `تم تصدير ${rows.length} دفعة إلى Excel`);
}

  ];
  return [
    {k:'quantity', l:'الكمية'}, {k:'notes', l:'ملاحظات'}, {k:'createdAt', l:'التاريخ', fmt:fmtDate}
  ];
}

function renderRecordsTable(){
  const type = document.getElementById('recType').value;
  const q = document.getElementById('recSearch').value.trim().toLowerCase();
  const cols = recordColumns(type);
  const isOwner = CURRENT_USER.role === 'owner';
  let rows = [...DB[type]].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(q){
    rows = rows.filter(r => JSON.stringify(r).toLowerCase().includes(q));
  }
  const showPhoto = type === 'losses';
  const extraCols = (isOwner?1:0) + (showPhoto?1:0);
  const wrap = document.getElementById('recTableWrap');
  wrap.innerHTML = `
  <table class="w-full text-sm text-right">
    <thead><tr class="text-ink/50 border-b border-line">
      ${cols.map(c=>`<th class="py-2">${c.l}</th>`).join('')}
      ${showPhoto? `<th>الصورة</th>`:''}
      ${isOwner? `<th></th>`:''}
    </tr></thead>
    <tbody>
    ${rows.length===0? `<tr><td colspan="${cols.length+extraCols}" class="py-6 text-center text-ink/40">لا توجد نتائج</td></tr>` :
      rows.map(r=>`
      <tr class="border-b border-line/60" data-row="${r.id}">
        ${cols.map(c=>`<td class="py-2.5">${c.fmt? c.fmt(r[c.k], r) : esc(r[c.k] ?? '—')}</td>`).join('')}
        ${showPhoto? `<td>${r.photo? `<img data-viewphoto="${r.id}" src="${r.photo}" class="w-9 h-9 object-cover rounded-lg border border-line cursor-pointer">` : `<span class="text-ink/30 text-xs">—</span>`}</td>`:''}
        ${isOwner? `
        <td class="whitespace-nowrap">
          <button data-edit="${type}:${r.id}" class="text-forest hover:opacity-70 ms-1" title="تعديل">${ICONS.edit}</button>
          <button data-del="${type}:${r.id}" class="text-barn hover:opacity-70 ms-2" title="حذف">${ICONS.trash}</button>
        </td>`:''}
      </tr>`).join('')}
    </tbody>
  </table>`;

  if(showPhoto){
    wrap.querySelectorAll('[data-viewphoto]').forEach(img=>{
      img.addEventListener('click', ()=>{
        const rec = DB.losses.find(l=>l.id===img.dataset.viewphoto);
        if(rec && rec.photo) openPhotoModal(rec.photo);
      });
    });
  }

  if(isOwner){
    wrap.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
      const [t,id] = b.dataset.edit.split(':'); openEditRecord(t,id);
    }));
    wrap.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
      const [t,id] = b.dataset.del.split(':'); deleteRecord(t,id);
    }));
  }
}

function openEditRecord(type, id){
  const rec = DB[type].find(r=>r.id===id);
  if(!rec) return;
  const cols = recordColumns(type).filter(c=>c.k!=='createdAt' && !(type==='batches' && c.k==='quantity'));
  const showPhoto = type === 'losses';
  let editPhotoData = rec.photo || null;
  openModal(`
    <div class="p-6">
      <h3 class="font-bold text-forest text-lg mb-4">تعديل السجل</h3>
      <form id="editRecordForm" class="space-y-3">
        ${cols.map(c=>`
          <div>
            <label class="text-xs font-bold text-ink/60">${c.l}</label>
            <input name="${c.k}" value="${esc(rec[c.k])}" class="w-full border border-line rounded-lg px-3 py-2 mt-1">
          </div>`).join('')}
        ${showPhoto? `
        <div>
          <label class="text-xs font-bold text-ink/60">الصورة</label>
          <div class="flex items-center gap-3 mt-1">
            <div id="editPhotoPreviewWrap" class="${editPhotoData? '' : 'hidden'}">
              <img id="editPhotoPreview" src="${editPhotoData||''}" class="w-16 h-16 object-cover rounded-lg border border-line">
            </div>
            <label for="editPhotoInput" class="flex-1 flex items-center justify-center gap-2 border-2 border-dashed border-line rounded-lg py-3 cursor-pointer hover:bg-cream text-ink/50 text-xs font-bold">
              ${ICONS.camera} <span>${editPhotoData? 'استبدال الصورة' : 'إضافة صورة'}</span>
            </label>
            <input id="editPhotoInput" type="file" accept="image/*" capture="environment" class="hidden">
            ${editPhotoData? `<button type="button" id="editPhotoRemove" class="text-barn text-xs font-bold">حذف</button>`:''}
          </div>
        </div>`:''}
        <div class="flex gap-2 pt-2">
          <button type="submit" class="btn flex-1 bg-forest text-cream font-bold py-2.5 rounded-lg">حفظ التعديلات</button>
          <button type="button" id="cancelEdit" class="btn px-4 rounded-lg border border-line font-bold">إلغاء</button>
        </div>
      </form>
    </div>`);
  document.getElementById('cancelEdit').addEventListener('click', closeModal);
  if(showPhoto){
    document.getElementById('editPhotoInput').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        editPhotoData = await compressImageFile(file);
        const wrap = document.getElementById('editPhotoPreviewWrap');
        document.getElementById('editPhotoPreview').src = editPhotoData;
        wrap.classList.remove('hidden');
      }catch(err){ toast(err.message || 'تعذّر تحميل الصورة', 'err'); }
    });
    const removeBtn = document.getElementById('editPhotoRemove');
    if(removeBtn) removeBtn.addEventListener('click', ()=>{
      editPhotoData = null;
      document.getElementById('editPhotoPreviewWrap').classList.add('hidden');
    });
  }
  document.getElementById('editRecordForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const before = JSON.stringify(rec);
    const numericKeys = ['quantity', ...GRADE_FIELDS.map(g=>g.k)];
    for(const [k,v] of fd.entries()){ rec[k] = numericKeys.includes(k) ? Number(v)||0 : v; }
    if(type==='batches'){ rec.quantity = GRADE_FIELDS.reduce((s,g)=>s+Number(rec[g.k]||0),0); }
    if(showPhoto){ rec.photo = editPhotoData; }
    saveDB(DB);
    logAudit('تعديل سجل', type, `${id} — قبل: ${before}`);
    toast('تم حفظ التعديلات');
    closeModal();
    renderRecordsTable();
    navigate(CURRENT_VIEW);
  });
}

function deleteRecord(type, id){
  openModal(`
    <div class="p-6 text-center">
      <h3 class="font-bold text-barn text-lg mb-2">تأكيد الحذف</h3>
      <p class="text-ink/60 mb-5">هل أنت متأكد من حذف هذا السجل؟ لا يمكن التراجع عن هذه الخطوة.</p>
      <div class="flex gap-2">
        <button id="confirmDel" class="btn flex-1 bg-barn text-cream font-bold py-2.5 rounded-lg">حذف نهائي</button>
        <button id="cancelDel" class="btn px-4 rounded-lg border border-line font-bold">إلغاء</button>
      </div>
    </div>`);
  document.getElementById('cancelDel').addEventListener('click', closeModal);
  document.getElementById('confirmDel').addEventListener('click', ()=>{
    const rec = DB[type].find(r=>r.id===id);
    DB[type] = DB[type].filter(r=>r.id!==id);
    saveDB(DB);
    logAudit('حذف سجل', type, `${id} — ${JSON.stringify(rec)}`);
    toast('تم حذف السجل');
    closeModal();
    navigate(CURRENT_VIEW);
  });
}

function attachViewHandlers(key){
  if(key==='receive'){
    document.querySelectorAll('.receive-grade-input').forEach(inp=>{
      inp.addEventListener('input', updateReceiveTotals);
    });
    updateReceiveTotals();

    document.querySelectorAll('[data-gradebtn]').forEach(btn=>{
      btn.addEventListener('click', ()=> openBatchGradeModal(btn.dataset.gradebtn));
    });

    document.getElementById('exportBatchesExcelBtn')?.addEventListener('click', exportBatchesExcel);
    document.getElementById('printBatchesBtn')?.addEventListener('click', printBatchesReport);

    document.getElementById('receiveForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const grades = {};
      GRADE_FIELDS.forEach(g=>{ grades[g.k] = Number(fd.get(g.k))||0; });
      const total = GRADE_FIELDS.reduce((s,g)=>s+grades[g.k],0);
      if(total<=0){
        toast('ادخل كمية في تصنيف واحد على الأقل (سليم، لايح، فرزة، فاطس، معدوم)', 'err');
        return;
      }
      const rec = {
        id: uid('BAT'),
        batchNumber: fd.get('batchNumber').trim(),
        source: fd.get('source').trim(),
        ...grades,
        quantity: total,
        notes: fd.get('notes').trim(),
        createdBy: CURRENT_USER.username,
        createdAt: nowISO()
      };
      DB.batches.push(rec);
      saveDB(DB);
      const detail = GRADE_FIELDS.map(g=>`${g.l} ${grades[g.k]} (${total>0?(grades[g.k]/total*100).toFixed(1):'0.0'}%)`).join('، ');
      logAudit('استلام دفعة', 'batches', `دفعة ${rec.batchNumber} — إجمالي ${rec.quantity} | ${detail}`);
      toast('تم تسجيل الدفعة وإضافتها للمخزون');
      navigate('receive');
    });
  }

  if(key==='distribute'){
    document.getElementById('distributeForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const qty = Number(fd.get('quantity'));
      const s = computeStock();
      if(qty > s.available){
        toast(`الكمية أكبر من المخزون المتاح (${s.available})`, 'err');
        return;
      }
      const rec = {
        id: uid('DIS'),
        buyerName: fd.get('buyerName').trim(),
        phone: fd.get('phone').trim(),
        quantity: qty,
        driver: fd.get('driver').trim(),
        notes: fd.get('notes').trim(),
        createdBy: CURRENT_USER.username,
        createdAt: nowISO()
      };
      DB.distributions.push(rec);
      saveDB(DB);
      logAudit('توزيع دفعة', 'distributions', `${rec.buyerName} — ${rec.quantity} قطعة`);
      toast('تم تسجيل عملية التوزيع');
      e.target.reset();
      navigate('distribute');
      openSlipModal(rec.id);
    });

    document.querySelectorAll('[data-slip]').forEach(b=>{
      b.addEventListener('click', ()=>openSlipModal(b.dataset.slip));
    });
  }

  if(key==='loss'){
    let lossPhotoData = null;
    const photoInput = document.getElementById('lossPhotoInput');
    const photoPreviewWrap = document.getElementById('lossPhotoPreviewWrap');
    const photoPreview = document.getElementById('lossPhotoPreview');
    const photoRemoveBtn = document.getElementById('lossPhotoRemove');

    photoInput.addEventListener('change', async ()=>{
      const file = photoInput.files[0];
      if(!file) return;
      try{
        lossPhotoData = await compressImageFile(file);
        photoPreview.src = lossPhotoData;
        photoPreviewWrap.classList.remove('hidden');
      }catch(err){
        toast(err.message || 'تعذّر تحميل الصورة', 'err');
        photoInput.value = '';
      }
    });
    photoRemoveBtn.addEventListener('click', ()=>{
      lossPhotoData = null;
      photoInput.value = '';
      photoPreviewWrap.classList.add('hidden');
    });

    document.getElementById('lossForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const qty = Number(fd.get('quantity'));
      const s = computeStock();
      if(qty > s.available){
        toast(`العدد أكبر من المخزون المتاح (${s.available})`, 'err');
        return;
      }
      const rec = {
        id: uid('LOS'),
        quantity: qty,
        notes: fd.get('notes').trim(),
        photo: lossPhotoData || null,
        createdBy: CURRENT_USER.username,
        createdAt: nowISO()
      };
      DB.losses.push(rec);
      saveDB(DB);
      logAudit('تسجيل فاقد', 'losses', `${rec.quantity} قطعة — ${rec.notes||''}${rec.photo? ' (بصورة)':''}`);
      toast('تم تسجيل الفاقد');
      navigate('loss');
    });

    document.querySelectorAll('[data-viewphoto]').forEach(img=>{
      img.addEventListener('click', ()=>{
        const rec = DB.losses.find(l=>l.id===img.dataset.viewphoto);
        if(rec && rec.photo) openPhotoModal(rec.photo);
      });
    });
  }

  if(key==='records'){
    renderRecordsTable();
    document.getElementById('recType').addEventListener('change', renderRecordsTable);
    document.getElementById('recSearch').addEventListener('input', renderRecordsTable);
    document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);
  }

  if(key==='owner'){
    document.getElementById('syncNowBtn').addEventListener('click', ()=>{
      saveDB(DB);
      logAudit('مزامنة يدوية', 'settings', 'تمت المزامنة يدويًا');
      toast('تمت المزامنة بنجاح');
      navigate('owner');
    });
    document.getElementById('settingsForm').addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      DB.settings.companyName = fd.get('companyName').trim();
      DB.settings.whatsapp = fd.get('whatsapp').trim().replace(/\D/g,'');
      DB.settings.thresholdAlert = Number(fd.get('thresholdAlert'));
      DB.settings.deliveryTerms = fd.get('deliveryTerms').trim();
      DB.settings.notes = fd.get('notes').trim();
      saveDB(DB);
      logAudit('تحديث الإعدادات', 'settings', 'تم تعديل إعدادات الشركة');
      toast('تم حفظ الإعدادات');
      navigate('owner');
    });
    document.getElementById('addUserBtn').addEventListener('click', ()=>{
      openModal(`
        <div class="p-6">
          <h3 class="font-bold text-forest text-lg mb-4">إضافة مستخدم جديد</h3>
          <form id="addUserForm" class="space-y-3">
            <div>
              <label class="text-xs font-bold text-ink/60">اسم المستخدم</label>
              <input name="username" required class="w-full border border-line rounded-lg px-3 py-2 mt-1">
            </div>
            <div>
              <label class="text-xs font-bold text-ink/60">كلمة المرور</label>
              <input name="password" required class="w-full border border-line rounded-lg px-3 py-2 mt-1">
            </div>
            <div>
              <label class="text-xs font-bold text-ink/60">الصلاحية</label>
              <select name="role" class="w-full border border-line rounded-lg px-3 py-2 mt-1">
                <option value="admin">الاستلام والتوزيع</option>
                <option value="owner">الأونر</option>

            </div>

        document.getElementById('pwForm').addEventListener('submit', (e)=>{
          e.preventDefault();
          u.password = new FormData(e.target).get('password');
          saveDB(DB);
          logAudit('تغيير كلمة مرور', 'users', `${u.username}`);
          toast('تم تحديث كلمة المرور');
          closeModal();
          navigate('owner');
        });
      });
    });

}

function buildWhatsappMessage(d){
  return [
    `شركة Pure Line - إيصال تسليم كتاكيت رومي`,
    `رقم العملية: ${d.id}`,
    `اسم المشتري: ${d.buyerName}`,
    `العدد المستلم: ${d.quantity}`,

    `التاريخ والوقت: ${fmtDate(d.createdAt)}`,
    `حالة الشحنة: تم التسليم بنجاح`
  ].join('\n');
}

/* -------------------------------- CSV export -------------------------------- */
function exportCsv(){
  const type = document.getElementById('recType').value;
  const cols = recordColumns(type);
  const rows = [...DB[type]].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const header = cols.map(c=>c.l).join(',');
  const lines = rows.map(r => cols.map(c=>{
    const v = c.fmt ? c.fmt(r[c.k], r) : (r[c.k] ?? '');
    return `"${String(v).replace(/"/g,'""')}"`;
  }).join(','));
  const csv = '\uFEFF' + [header, ...lines].join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `pureline_${type}_${Date.now()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logAudit('تصدير بيانات', type, `تم تصدير ${rows.length} سجل إلى CSV`);
}
